# quick-links — the goto.*/qr.* short-link + secure-redirect service, its
# Postgres, and pgAdmin, packaged as one chart (mirrors the hanna chart).
#
# Deployed into its own namespace, `quicklinks`, which personal-infrastructure
# owns (src/self-hosted/app-namespaces.ts): default-deny network policies (plus
# quick-links -> db and Grafana -> db, boxes.ts), the restricted Pod Security
# Standard, the access middlewares, and the way in from Traefik. This chart
# owns what runs inside it.
#
#   helm upgrade --install quick-links ./chart -n quicklinks

# The target namespace. Off because personal-infrastructure creates it; set
# true for a self-contained install on a fresh cluster.
namespace:
  create: false

# Internet-facing workloads ride the hardware-isolated "untrusted" apps VM.
nodeSelector:
  kubernetes.io/hostname: k3s-apps-vm
tolerations:
  - key: workload-type
    operator: Equal
    value: untrusted
    effect: NoSchedule
  # replicas:1 pinned to the one untrusted node → this pod can only run there.
  # The default 300s not-ready/unreachable tolerations then hurt: on a node
  # reboot (nightly autoUpgrade / longer outage) k8s evicts the pod and makes a
  # replacement that CAN'T schedule elsewhere, leaving the original as an
  # uncollected "Error" pod corpse. Ride out node blips (6h), restart in place.
  - key: node.kubernetes.io/not-ready
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 21600
  - key: node.kubernetes.io/unreachable
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 21600

app:
  image:
    repository: registry.k8s.gated.conrad-klaus.de/quick-links
    tag: latest
    pullPolicy: Always
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 64Mi }

# Public hosts — both aliases route to the same app. Their listeners on the
# `public` Gateway, and the certificates, come from personal-infrastructure
# (public.ts lists both hosts for this namespace).
hosts:
  - goto.conrad-klaus.de
  - qr.conrad-klaus.de

rateLimit:
  average: 10 # sustained req/s per client
  burst: 20 # bucket depth
  # Bucket by the REAL client IP. All origin traffic arrives from Cloudflare edge
  # IPs (enforced by cloudflare-only), so without this Traefik would rate-limit
  # every user as one global bucket. Cf-Connecting-IP is trustworthy precisely
  # because cloudflare-only guarantees the request came through Cloudflare.
  sourceHeader: Cf-Connecting-IP

postgres:
  # 13 -> 18 on 2026-08-26. Postgres 13 went EOL in November 2025, so it stopped
  # receiving security patches entirely; Trivy had this image at 19 critical /
  # 133 high, second-worst in the cluster.
  #
  # READ THIS BEFORE CHANGING THE TAG AGAIN — the 18 image moved the data dir:
  #
  #     postgres:13 / :17   PGDATA=/var/lib/postgresql/data   VOLUME .../data
  #     postgres:18         PGDATA=/var/lib/postgresql/18/docker
  #                         VOLUME=/var/lib/postgresql
  #
  # So `dataMountPath` below MUST track the image's VOLUME, not PGDATA. If you
  # bump to 18+ while still mounting the PVC at /var/lib/postgresql/data, the
  # container starts happily, initdb's a brand-new empty cluster inside the
  # container's ephemeral layer, and every link silently disappears on the next
  # pod restart. Nothing errors. Going back to 17 or lower means reverting
  # dataMountPath to /var/lib/postgresql/data in the same change.
  image: postgres:18
  dataMountPath: /var/lib/postgresql
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }
  storage: 1Gi
  storageClass: local-path

# Grafana integration. This repo OWNS its observability: the dashboard JSON, the
# datasource, and a read-only DB role all live here and are auto-discovered by
# Grafana's k8s-sidecar (enabled once in personal-infrastructure). Toggle off to
# stop shipping the sidecar ConfigMap/Secret.
grafana:
  enabled: true
  folder: Apps # Grafana folder the dashboard lands in (grafana_folder annotation)
  datasourceUid: quicklinks-pg # referenced by the dashboard panels
  # Read-only role Grafana connects as — SELECT on click_events and redirects.
  # Its password is NOT in git (it was until 2026-11-05 and has been rotated).
  # personal-infrastructure owns it (Pulumi config quicklinks:grafanaRoPassword
  # -> Secret below); the chart reads that Secret at deploy time. Same split as
  # the pgadmin-oidc Secret.
  roUser: grafana_ro
  roPasswordSecret:
    name: quicklinks-grafana-ro
    key: password
  # true = render without a cluster (helm template/lint) using a placeholder
  # password. Never set this for a real deploy.
  offlineRender: false

# DB + pgAdmin credentials Secret (envFrom of app, postgres and pgAdmin). Owned
# by personal-infrastructure, NOT this repo: Pulumi config
# quicklinks:postgresPassword / quicklinks:pgadminDefaultPassword -> Secret
# quicklinks-db (src/self-hosted/gateway.ts), with keys POSTGRES_DB,
# POSTGRES_USER, POSTGRES_PASSWORD, PGADMIN_DEFAULT_EMAIL,
# PGADMIN_DEFAULT_PASSWORD. Until 2026-11-05 the values sat here in plain text
# (rotated on the move).
#
# POSTGRES_PASSWORD only seeds a NEW database. To rotate on a live one: new
# config value + `pulumi up`, then `ALTER ROLE "user" PASSWORD '…'`, then
# `kubectl -n quicklinks rollout restart deploy/quick-links deploy/db`.
#
# create:true renders a Secret from `data` instead (fresh, self-contained
# installs only — never commit real values).
secret:
  create: false
  name: quicklinks-db
  data: {}

pgadmin:
  # OFF, and do NOT just flip this to true: templates/pgadmin.yaml is stale
  # since the move to the `quicklinks` namespace (2026-10-21) and refuses to
  # render (a `fail` at its top) until it is reworked. As written it would:
  #   - run as root (runAsUser: 0), which the namespace's restricted Pod
  #     Security Standard rejects;
  #   - create an Ingress, which the cluster no longer serves and admission
  #     refuses (Traefik's Ingress provider is off; tailnet hosts are
  #     HTTPRoutes on the `tailnet` Gateway now);
  #   - have no node selector / untrusted toleration, so it could only land on
  #     the trusted control node (`k3s`) — wrong trust zone for this app, and
  #     its PVC now lives on k3s-apps-vm, so the pod would sit in Pending;
  #   - have no host entry: pgadmin.gated.conrad-klaus.de is not in
  #     personal-infrastructure src/self-hosted/public.ts (INTERNAL_HOSTS), so
  #     no Gateway listener exists for it.
  # It was originally turned off to save memory on the Pi (requests 256Mi /
  # limits 512Mi). Use `kubectl -n quicklinks exec deploy/db -- psql …` or the
  # Grafana dashboards for DB access.
  #
  # Kept until someone decides: the data PVC quicklinks-pgadmin-data (copied
  # from the old default namespace, owned by uid 5050, on k3s-apps-vm,
  # resource-policy:keep), the `pgadmin-oidc` Secret (Pulumi) and the
  # Authelia `pgadmin` client. To bring it back: run as pgAdmin's own user
  # 5050 (non-root, restricted securityContext), pin it to k3s-apps-vm with
  # the untrusted toleration, replace the Ingress with an HTTPRoute
  # (parentRef tailnet/kube-system), add the host to INTERNAL_HOSTS, then
  # remove the `fail`. To retire it instead: delete the template, the PVC,
  # the Secret and the Authelia client.
  enabled: false
  image: dpage/pgadmin4:8
  host: pgadmin.gated.conrad-klaus.de
  tlsSecret: pgadmin-tls
  # Tailscale-only — pgAdmin must never be reachable from the public internet.
  entryPoint: websecure-ts
  # OIDC client secret is managed externally by personal-infrastructure's Pulumi
  # stack (Secret `pgadmin-oidc`, key `client-secret`); the chart references but
  # does NOT create it, so the rotation surface stays in one place.
  oidcSecretName: pgadmin-oidc
  oidcSecretKey: client-secret
  storage: 1Gi
  storageClass: local-path
  resources:
    requests: { cpu: 20m, memory: 256Mi }
    limits: { memory: 512Mi }
