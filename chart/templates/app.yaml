apiVersion: apps/v1
kind: Deployment
metadata:
  name: quick-links
  labels:
    app: quick-links
    {{- include "quicklinks.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quick-links
  template:
    metadata:
      labels:
        app: quick-links
    spec:
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      # The binary is pure-Go in a scratch image with no USER directive, so
      # without this it runs as uid 0. It needs no privileges (port 8080,
      # stdout logging, DB over the network) — run it as nobody so the
      # namespace can enforce the `restricted` Pod Security Standard.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POSTGRES_HOST
              value: db
          envFrom:
            - secretRef:
                name: {{ .Values.secret.name }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: quick-links
  labels:
    {{- include "quicklinks.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: quick-links
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Per-client rate limit for the public goto/qr endpoints — defense-in-depth
# against path enumeration (secret links are already unguessable on 128-bit
# entropy). Mirrors hanna's /i/ rateLimit. See values.yaml for the sourceHeader
# rationale (bucket by real client IP behind Cloudflare).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: quicklinks-ratelimit
  labels:
    {{- include "quicklinks.labels" . | nindent 4 }}
spec:
  rateLimit:
    average: {{ .Values.rateLimit.average }}
    burst: {{ .Values.rateLimit.burst }}
    period: 1s
    sourceCriterion:
      requestHeaderName: {{ .Values.rateLimit.sourceHeader }}
---
# Public through Cloudflare. The cluster refuses this route without the
# cloudflare-only filter; the rate limit runs after it, so it only ever sees
# Cloudflare-proxied requests (and their Cf-Connecting-IP).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: quick-links
  labels:
    {{- include "quicklinks.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: public
      namespace: kube-system
  hostnames:
    {{- toYaml .Values.hosts | nindent 4 }}
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: cloudflare-only
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: quicklinks-ratelimit
      backendRefs:
        - name: quick-links
          port: 80
